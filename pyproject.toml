[project]
name = "customer-service-data-analyst-agent"
version = "0.1.0"
description = "LangGraph customer service data analyst agent with CLI, Streamlit UI, MCP tools, and persistent memory"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets>=4.8.5",
    "fastmcp>=3.3.1",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "langgraph-checkpoint-postgres>=3.1.0",
    "pandas>=3.0.3",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "streamlit>=1.51.0",
]
